<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motorcycle POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="pos-container">
        <!-- Main Product Area -->
        <main class="products-area">
            <header class="top-nav">
                <div class="brand">
                    <div class="logo"></div>
                    <h1>Tablet POS System</h1>
                </div>
                <div class="top-actions">
                    <div class="search-bar">
                        <input type="text" id="searchInput" placeholder="Search inventory...">
                    </div>
                    <div class="notification-bell" id="btnNotifications">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        <span class="badge hidden" id="outOfStockBadge">0</span>
                    </div>
                    <!-- Notification Panel (toggled by bell) -->
                    <div class="notif-panel hidden" id="notifPanel">
                        <div class="notif-header">
                            <span>Stock Alerts</span>
                            <span class="sync-dot" id="syncDot" title="Syncing..."></span>
                        </div>
                        <div class="notif-list" id="notifList">
                            <div class="notif-empty">All stock levels OK ✓</div>
                        </div>
                    </div>
                </div>
            </header>
            
            <div class="scanner-banner">
                <span class="scanner-badge pulse">📷 Scanner Ready</span>
            </div>

            
            <div class="categories">
                <button class="cat-btn active">All Parts</button>
                <button class="cat-btn">Engine</button>
                <button class="cat-btn">Brakes</button>
                <button class="cat-btn">Accessories</button>
                <button class="cat-btn">Services</button>
            </div>


            <div class="product-grid" id="productGrid">
                <!-- Products injected here via JS -->
            </div>
        </main>

        <!-- Sidebar Cart -->
        <aside class="cart-sidebar">
            <div class="cart-header">
                <h2>Current Order</h2>
                <button class="btn-clear" id="btnClearCart">Clear</button>
            </div>
            
            <div class="cart-items" id="cartItems">
                <!-- Cart items injected here -->
                <div class="empty-cart-state">Cart is empty</div>
            </div>
            
            <div class="cart-footer">
                <div class="summary-line">
                    <span>Subtotal</span>
                    <span id="subTotal">$0.00</span>
                </div>
                <div class="summary-line">
                    <span>Tax (10%)</span>
                    <span id="taxTotal">$0.00</span>
                </div>
                <div class="summary-line total">
                    <span>Total</span>
                    <span class="total-amount" id="grandTotal">$0.00</span>
                </div>
                <button class="btn-checkout" id="btnCheckout">Process Checkout</button>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
